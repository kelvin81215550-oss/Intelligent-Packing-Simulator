<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team 15 - Intelligent Packing Assistant Sim</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 8px; border: 1px solid #333; }
    button { padding: 8px 14px; margin-top: 8px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="ui">
    <h3 style="margin:0 0 6px 0;">Team 15 - Simulation MVP</h3>
    <p style="margin:0; font-size:14px;">Status: Ready for AI Pipeline</p>
    <button onclick="runPacking(['Heavy', 'Normal', 'Fragile'])">Simulate Test T04</button>
  </div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Ground & Box
    const grid = new THREE.GridHelper(10, 10);
    scene.add(grid);
    const boxGeo = new THREE.BoxGeometry(2, 1.5, 2);
    const boxMat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
    const box = new THREE.Mesh(boxGeo, boxMat);
    box.position.set(0, 0.75, 0);
    scene.add(box);

    // 2 Robotic Arms (Represented by Pillars)
    const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2), new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
    arm1.position.set(-2.5, 1, 0);
    const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2), new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
    arm2.position.set(2.5, 1, 0);
    scene.add(arm1, arm2);

    // 3 Objects: Heavy (Red), Normal (Blue), Fragile (Yellow)
    const heavy = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
    heavy.position.set(-1.5, 0.2, 1.5);

    const normal = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshLambertMaterial({ color: 0x0000ff }));
    normal.position.set(0, 0.2, 1.5);

    const fragile = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshLambertMaterial({ color: 0xffff00 }));
    fragile.position.set(1.5, 0.2, 1.5);

    scene.add(heavy, normal, fragile);

    camera.position.set(0, 4, 6);
    camera.lookAt(0, 0, 0);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Packing Sequence Animation Trigger
    function runPacking(order) {
      const targets = { Heavy: heavy, Normal: normal, Fragile: fragile };
      const heights = { Heavy: 0.2, Normal: 0.6, Fragile: 1.0 };
      
      let delay = 0;
      order.forEach((itemKey) => {
        const item = targets[itemKey];
        const targetY = heights[itemKey];
        gsap.to(item.position, { y: 2, duration: 1, delay: delay });
        gsap.to(item.position, { x: 0, z: 0, duration: 1, delay: delay + 1 });
        gsap.to(item.position, { y: targetY, duration: 1, delay: delay + 2 });
        delay += 3;
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
